name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Siapkan folder web
        run: |
          mkdir www
          cp index.html app.js sw.js manifest.json icon-*.png www/
      - name: Scaffold Capacitor
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/local-notifications@6
          npx cap init "Kelontong 20/80" id.kelontong.app --web-dir=www
          npx cap add android
          D=android/app/src/main/java/id/kelontong/app
          mkdir -p $D
          cp android-plugin/SaveFilePlugin.java android-plugin/MainActivity.java $D/
          npx cap sync android
      - name: Izin notifikasi dan ikon status bar
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS RECEIVE_BOOT_COMPLETED SCHEDULE_EXACT_ALARM USE_EXACT_ALARM; do
            grep -q "android.permission.$P" $M || sed -i "s#<application#<uses-permission android:name=\"android.permission.$P\" />\n    <application#" $M
          done
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_kelontong.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFF" android:pathData="M12,22c1.1,0 2,-0.9 2,-2h-4c0,1.1 0.89,2 2,2zM18,16v-5c0,-3.07 -1.64,-5.64 -4.5,-6.32V4c0,-0.83 -0.67,-1.5 -1.5,-1.5s-1.5,0.67 -1.5,1.5v0.68C7.63,5.36 6,7.92 6,11v5l-2,2v1h16v-1l-2,-2z"/>
          </vector>
          EOF
      - name: Ikon dan versionCode
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in $R/mipmap-*; do
            cp icon-192.png $d/ic_launcher.png
            cp icon-192.png $d/ic_launcher_round.png
            rm -f $d/ic_launcher_foreground.png
          done
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - name: Build dan tanda tangan
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cd android
          if [ -n "$KS" ]; then
            ./gradlew assembleRelease
            echo "$KS" | base64 -d > ../release.jks
            BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
            $BT/zipalign -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk ../aligned.apk
            $BT/apksigner sign --ks ../release.jks --ks-pass env:KS_PASS --key-pass env:KEY_PASS --ks-key-alias "$KEY_ALIAS" --out ../Kelontong.apk ../aligned.apk
          else
            echo "PERINGATAN: keystore tidak ada, memakai debug build (tanda tangan berubah tiap build)"
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../Kelontong.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Kelontong-APK
          path: Kelontong.apk
